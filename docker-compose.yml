version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stadium_pulse_app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8080
      - GOOGLE_CLOUD_PROJECT=stadiumpulse-2026
    depends_on:
      - firestore-emulator
    networks:
      - stadium-net

  firestore-emulator:
    image: mtlynch/firestore-emulator:latest
    container_name: stadium_pulse_db_emulator
    ports:
      - "8080:8080"
    environment:
      - FIRESTORE_PROJECT_ID=stadiumpulse-2026
    networks:
      - stadium-net

networks:
  stadium-net:
    driver: bridge
